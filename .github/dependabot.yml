version: 2

updates:
    - package-ecosystem: gomod
      directory: /backend
      schedule:
          interval: weekly
          day: monday
          time: "06:00"
          timezone: Europe/Riga
      open-pull-requests-limit: 5

    - package-ecosystem: bun
      directory: /frontend
      schedule:
          interval: weekly
          day: monday
          time: "06:15"
          timezone: Europe/Riga
      open-pull-requests-limit: 5

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "06:30"
          timezone: Europe/Riga
      open-pull-requests-limit: 5
