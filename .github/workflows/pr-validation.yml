name: PR Validation

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pr-validation-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    backend:
        name: Backend
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        defaults:
            run:
                working-directory: backend
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: backend/go.mod
                  cache-dependency-path: backend/go.sum

            - name: Check formatting
              run: |
                  files=$(gofmt -l .)
                  if [ -n "$files" ]; then
                    printf 'The following files need gofmt:\n%s\n' "$files"
                    exit 1
                  fi

            - name: Build
              run: make build

            - name: Unit tests
              run: make test

            - name: Enforce server and game coverage
              run: |
                  go test -coverprofile=server.cover ./cmd/server
                  test "$(go tool cover -func=server.cover | awk '/^total:/ { print $3 }')" = "100.0%"
                  go test -coverprofile=game.cover ./internal/game
                  test "$(go tool cover -func=game.cover | awk '/^total:/ { print $3 }')" = "100.0%"

            - name: Race detector
              run: go test -race ./...

            - name: Static analysis
              run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

            - name: Vulnerability scan
              run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

            - name: Fuzz parsers
              run: |
                  go test ./cmd/server -run '^$' -fuzz '^FuzzDecodeLeaderboardCursor$' -fuzztime=3s
                  go test ./internal/game -run '^$' -fuzz '^FuzzRestoreGameState$' -fuzztime=3s

            - name: Integration tests
              run: make test-integration

    frontend:
        name: Frontend
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        defaults:
            run:
                working-directory: frontend
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.3.14

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check formatting and linting
              run: bunx vp check

            - name: Build
              run: bunx vp build

            - name: Test
              run: bunx vp test run

    ci:
        name: CI
        if: ${{ always() }}
        needs:
            - backend
            - frontend
        runs-on: ubuntu-24.04
        timeout-minutes: 2
        permissions: {}
        steps:
            - name: Verify mandatory jobs succeeded
              env:
                  BACKEND_RESULT: ${{ needs.backend.result }}
                  FRONTEND_RESULT: ${{ needs.frontend.result }}
              run: |
                  test "$BACKEND_RESULT" = success
                  test "$FRONTEND_RESULT" = success
