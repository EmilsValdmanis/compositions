name: PR Validation

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pr-validation-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    backend:
        name: Backend
        permissions:
            contents: read
            id-token: write
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        defaults:
            run:
                working-directory: backend
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: backend/go.mod
                  cache-dependency-path: backend/go.sum

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.2

            - name: Install workspace dependencies
              working-directory: .
              run: bun install --frozen-lockfile

            - name: Connect Turborepo remote cache
              if: >-
                  vars.TURBO_TEAM != '' &&
                  github.actor != 'dependabot[bot]' &&
                  (github.event_name != 'pull_request' ||
                   github.event.pull_request.head.repo.full_name == github.repository)
              uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
              with:
                  team: ${{ vars.TURBO_TEAM }}

            - name: Check formatting
              run: |
                  files=$(gofmt -l .)
                  if [ -n "$files" ]; then
                    printf 'The following files need gofmt:\n%s\n' "$files"
                    exit 1
                  fi

            - name: Build
              working-directory: .
              run: bun run build --filter=./backend

            - name: Unit tests
              working-directory: .
              run: bun run test --filter=./backend

            - name: Enforce server and game coverage
              run: |
                  go test -coverprofile=server.cover ./cmd/server
                  test "$(go tool cover -func=server.cover | awk '/^total:/ { print $3 }')" = "100.0%"
                  go test -coverprofile=game.cover ./internal/game
                  test "$(go tool cover -func=game.cover | awk '/^total:/ { print $3 }')" = "100.0%"

            - name: Race detector
              run: go test -race ./...

            - name: Static analysis
              run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

            - name: Vulnerability scan
              run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

            - name: Fuzz parsers
              run: |
                  go test ./cmd/server -run '^$' -fuzz '^FuzzDecodeLeaderboardCursor$' -fuzztime=25000x -parallel=1
                  go test ./internal/game -run '^$' -fuzz '^FuzzRestoreGameState$' -fuzztime=25000x -parallel=1

            - name: Integration tests
              working-directory: .
              run: bun run test-integration --filter=./backend

    frontend:
        name: Frontend
        permissions:
            contents: read
            id-token: write
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        defaults:
            run:
                working-directory: frontend
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Go for native workspace discovery
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: backend/go.mod
                  cache-dependency-path: backend/go.sum

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.2

            - name: Install dependencies
              working-directory: .
              run: bun install --frozen-lockfile

            - name: Connect Turborepo remote cache
              if: >-
                  vars.TURBO_TEAM != '' &&
                  github.actor != 'dependabot[bot]' &&
                  (github.event_name != 'pull_request' ||
                   github.event.pull_request.head.repo.full_name == github.repository)
              uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
              with:
                  team: ${{ vars.TURBO_TEAM }}

            - name: Check formatting and linting
              working-directory: .
              run: bun run check --filter=frontend

            - name: Build
              working-directory: .
              run: bun run build --filter=frontend

            - name: Test
              working-directory: .
              run: bun run test --filter=frontend

    ci:
        name: CI
        if: ${{ always() }}
        needs:
            - backend
            - frontend
        runs-on: ubuntu-24.04
        timeout-minutes: 2
        permissions: {}
        steps:
            - name: Verify mandatory jobs succeeded
              env:
                  BACKEND_RESULT: ${{ needs.backend.result }}
                  FRONTEND_RESULT: ${{ needs.frontend.result }}
              run: |
                  test "$BACKEND_RESULT" = success
                  test "$FRONTEND_RESULT" = success
