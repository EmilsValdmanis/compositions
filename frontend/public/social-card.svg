<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Compositions</title>
  <desc id="description">Build runs, close rounds, and play to 100.</desc>
  <defs>
    <linearGradient id="sky" x1="70" y1="45" x2="1130" y2="585" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06131D"/>
      <stop offset="1" stop-color="#0B2938"/>
    </linearGradient>
